version: 2
before:
  hooks:
    - go mod tidy
    - sh -c 'go run ./cmd/yukictl completion bash > bash_completion'
builds:
  - id: yukid
    binary: yukid
    env:
      - CGO_ENABLED=0
    main: ./cmd/yukid
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ustclug/Yuki/pkg/info.Version={{.Version}} -X github.com/ustclug/Yuki/pkg/info.BuildDate={{.Date}} -X github.com/ustclug/Yuki/pkg/info.GitCommit={{.Commit}}
  - id: yukictl
    binary: yukictl
    env:
      - CGO_ENABLED=0
    main: ./cmd/yukictl
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ustclug/Yuki/pkg/info.Version={{.Version}} -X github.com/ustclug/Yuki/pkg/info.BuildDate={{.Date}} -X github.com/ustclug/Yuki/pkg/info.GitCommit={{.Commit}}
archives:
  - ids:
      - yukid
      - yukictl
    formats:
      - binary
    name_template: "{{ .Binary }}_{{ .Os  }}_{{ .Arch }}"
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  use: github-native
nfpms:
  - id: default
    ids:
      - yukid
      - yukictl
    package_name: yuki
    homepage: https://github.com/ustclug/Yuki
    maintainer: "USTC LUG <lug@ustc.edu.cn>"
    description: |-
      USTC Mirror Manager
    formats:
      - deb
    umask: 0o022
    dependencies:
      - "docker.io | docker-engine | docker-ce"
    section: admin
    priority: extra
    provides:
      - yukid
      - yukictl
    scripts:
      postinstall: etc/postinst.sh
      preremove: etc/prerm.sh
    contents:
      - src: bash_completion
        dst: /etc/bash_completion.d/yukictl
      - src: etc/daemon.example.toml
        dst: /etc/yuki/
      - src: etc/yukid.service
        dst: /lib/systemd/system/
      - src: yukictl
        dst: /usr/bin/yuki
        type: symlink

dockers_v2:
  - id: yukid
    ids:
      - yukid
    dockerfile: Dockerfile
    images:
      - ghcr.io/ustclug/yukid
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--target=multiarch"

# modelines, feel free to remove those if you don't want/use them:
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
